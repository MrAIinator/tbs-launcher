<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TBS Launcher</title>
    <link rel="icon" href="/icon.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Unbounded:wght@500;700&display=swap" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="scan"></div>
    <main>
      <header>
        <div class="brand">
          <img class="logo" src="/icon.png" alt="" width="72" height="72" />
          <div>
            <p class="kicker">NULL SIGNAL // 1.21.1</p>
            <h1>THE BROKEN SCRIPT</h1>
            <p id="sub" class="muted">ENHANCED</p>
          </div>
        </div>
        <button id="settings-btn" type="button">НАСТРОЙКИ</button>
      </header>
      <div class="tear"></div>
      <section class="stage">
        <div class="license">
          <p id="account">не привязана</p>
          <button id="login" type="button">ПРИВЯЗАТЬ</button>
          <button id="logout" type="button" class="ghost">ВЫЙТИ</button>
        </div>
        <p id="login-box" class="code hidden"></p>
        <div class="play-row">
          <button id="update" type="button" class="side">ОБНОВИТЬ</button>
          <button id="play" class="glitch" type="button"><span id="play-label" data-text="ИГРАТЬ">ИГРАТЬ</span></button>
          <button id="repair" type="button" class="side">ПОЧИНИТЬ ФАЙЛЫ</button>
        </div>
        <p id="phase" class="muted">ожидание</p>
        <div class="bar"><div id="fill"></div></div>
        <p id="stats" class="muted"></p>
        <p id="warn" class="muted"></p>
        <div class="actions">
          <button id="mods-btn" type="button" class="ghost">МОДЫ</button>
          <button id="log-btn" type="button" class="ghost">ЛОГ</button>
          <button id="cancel" type="button" class="ghost">ОТМЕНА</button>
        </div>
      </section>
      <section id="panel" class="card hidden"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
